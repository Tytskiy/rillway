name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14t"
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.12"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Verify free-threading
        if: matrix.experimental
        run: >-
          uv run --python ${{ matrix.python-version }} python -c
          'import pytest, rillway, sys; assert not sys._is_gil_enabled()'

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy src/rillway
