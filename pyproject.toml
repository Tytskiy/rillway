[project]
name = "rillway"
version = "0.1.0"
description = "Typed, immutable, replayable dataset pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "universal-pathlib>=0.3.10,<0.4",
]
keywords = ["data-loading", "datasets", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Tytskiy/rillway"
Issues = "https://github.com/Tytskiy/rillway/issues"

[project.optional-dependencies]
parquet = [
    "pyarrow>=25.0.1",
]
huggingface = [
    "huggingface-hub>=1.0",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
